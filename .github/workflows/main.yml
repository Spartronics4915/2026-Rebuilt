# This is a basic workflow to build robot code.
name: main
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
permissions:
    contents: read
# Controls when the action will run. Triggers the workflow on push or pull request
on: [push, pull_request]
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    # This workflow contains a single job called "build"
    build:
        # The type of runner that the job will run on
        runs-on: ubuntu-22.04
        # This grabs the WPILib docker container
        container: wpilib/roborio-cross-ubuntu:2025-22.04
        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - uses: actions/checkout@v4

            # Declares the repository safe and not under dubious ownership.
            - name: Add repository to git safe directories
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            # Grant execute permission for gradlew
            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            # Cache Gradle packages
            - name: Cache Gradle packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
                  restore-keys: ${{ runner.os }}-gradle-

            - name: Compile and run tests on robot code
              run: ./gradlew build

            # Simulation smoke test
            # Run simulation, capture exit code and logs. Treat timeout (124) as acceptable
            # for a smoke test but record and upload logs if the simulation crashes early.
            - name: Run simulation smoke test
              shell: bash
              continue-on-error: true
              run: |
                  set -o pipefail
                  echo "Starting simulation for 15s (smoke test)..."
                  # Ensure gradlew is executable (harmless if already set)
                  chmod +x gradlew || true
                  # Capture stdout+stderr to a log file for later inspection
                  echo "--- Simulation run: $(date -u) ---" > simulate.log
                  timeout 15s ./gradlew simulateJava >> simulate.log 2>&1
                  rc=$?
                  
                  # Detect if "The robot program quit unexpectedly" exists in log
                  # (indicates a crash even if Gradle returned 0)
                  if grep -q "The robot program quit unexpectedly" simulate.log || grep -q "Unhandled exception" simulate.log; then
                      echo "CRASH_DETECTED=true" >> "$GITHUB_ENV"
                  else
                      echo "CRASH_DETECTED=false" >> "$GITHUB_ENV"
                  fi

                  echo $rc > sim_exit_code
                  if [ "$rc" -eq 0 ]; then
                      echo "Simulation completed successfully (rc=$rc)."
                  elif [ "$rc" -eq 124 ]; then
                      echo "Simulation timed out after 15s (rc=$rc)."
                  else
                      echo "Simulation crashed or failed early (rc=$rc). See simulate.log for details."
                  fi

            - name: Report simulation result and attach logs
              shell: bash
              if: always()
              run: |
                  rc=0
                  if [ -f sim_exit_code ]; then rc=$(cat sim_exit_code); fi
                  
                  crash_detected="${CRASH_DETECTED:-false}"
                  
                  # If simulation failed with a non-timeout non-zero exit code, OR we saw a crash in the logs
                  if ([ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]) || [ "$crash_detected" = "true" ]; then
                      echo "::warning::Build succeeded but robot simulation crashed or failed (rc=$rc, crash_detected=$crash_detected)."
                      echo "## Simulation smoke test: FAILED" >> "$GITHUB_STEP_SUMMARY"
                      if [ "$crash_detected" = "true" ]; then
                          echo "**Result**: Crash detected in logs." >> "$GITHUB_STEP_SUMMARY"
                      fi
                      echo "**Exit code**: $rc" >> "$GITHUB_STEP_SUMMARY"
                      echo "" >> "$GITHUB_STEP_SUMMARY"
                      echo '### Simulation log (tail - 200 lines):' >> "$GITHUB_STEP_SUMMARY"
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                      tail -n 200 simulate.log >> "$GITHUB_STEP_SUMMARY" || true
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "Simulation passed with code (rc=$rc)."
                      echo "## Simulation smoke test: Passed with code (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload simulation log
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: simulation-log
                  path: simulate.log

            - name: Fail job if simulation failed
              if: always()
              shell: bash
              run: |
                  rc=0
                  if [ -f sim_exit_code ]; then rc=$(cat sim_exit_code); fi
                  crash_detected="${CRASH_DETECTED:-false}"
                  
                  if ([ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]) || [ "$crash_detected" = "true" ]; then
                      echo "::error::Simulation smoke test failed. Failing job after uploading logs."
                      # If we have a non-zero exit code, use it; otherwise exit with 1
                      if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
                          exit $rc
                      else
                          exit 1
                      fi
                  fi
                  echo "No simulation failure detected (rc=$rc)."
