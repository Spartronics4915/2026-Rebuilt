# This is a basic workflow to build robot code.
name: main
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false
permissions:
    contents: read
# Controls when the action will run. Triggers the workflow on push or pull request
on: [push, pull_request]
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    # This workflow contains a single job called "main" internally
    main:
        name: Build and Simulate
        # The type of runner that the job will run on
        runs-on: ubuntu-22.04
        # This grabs the WPILib docker container
        container: wpilib/roborio-cross-ubuntu:2025-22.04
        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - uses: actions/checkout@v4

            # Declares the repository safe and not under dubious ownership.
            - name: Add repository to git safe directories
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            # Grant execute permission for gradlew
            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            # Sets up Java and Gradle with advanced caching
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  add-job-summary: never

            - name: Update libstdc++ for GLIBCXX_3.4.32
              id: update_lib
              run: |
                  if ! (
                      sudo apt-get update -y &&
                      sudo apt-get install software-properties-common -y &&
                      for i in {1..5}; do sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y && break || sleep 15; done &&
                      sudo apt-get update -y &&
                      sudo apt-get install --only-upgrade libstdc++6 -y
                  ); then
                      echo "::warning::Could not update libstdc++ from Launchpad (network timeout). Passing step and skipping remainder of job."
                      echo "**Notice:** Could not validate the commit (failed to update libstdc++ due to apt network timeouts). The rest of the job has been skipped." >> "$GITHUB_STEP_SUMMARY"
                      echo "SKIP_JOB=true" >> "$GITHUB_ENV"
                      exit 0
                  fi

            - name: Compile and run tests on robot code
              if: env.SKIP_JOB != 'true'
              shell: bash
              continue-on-error: true
              run: |
                  set -o pipefail
                  echo "Starting build..."
                  echo "--- Build run: $(date -u) ---" > build.log
                  rc=0
                  ./gradlew build 2>&1 | tee -a build.log || rc=$?
                  echo $rc > build_exit_code
                  if [ "$rc" -ne 0 ]; then
                      echo "BUILD_FAILED=true" >> "$GITHUB_ENV"
                      echo "Build failed with exit code $rc."
                  else
                      echo "BUILD_FAILED=false" >> "$GITHUB_ENV"
                      echo "Build succeeded."
                  fi

            - name: Report build result and attach logs
              shell: bash
              if: env.SKIP_JOB != 'true'
              run: |
                  if [ "${BUILD_FAILED:-false}" = "true" ]; then
                      rc=$(cat build_exit_code)
                      echo "::error::Gradle build failed (rc=$rc)."
                      echo "## Build: FAILED" >> "$GITHUB_STEP_SUMMARY"
                      echo "**Exit code**: $rc" >> "$GITHUB_STEP_SUMMARY"
                      echo "" >> "$GITHUB_STEP_SUMMARY"
                      echo '### Build log (tail - 200 lines):' >> "$GITHUB_STEP_SUMMARY"
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                      tail -n 200 build.log >> "$GITHUB_STEP_SUMMARY" || true
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                  elif [ -f build.log ]; then
                      echo "## Build: Passed" >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload build log
              if: env.SKIP_JOB != 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: build-log
                  path: build.log

            # Simulation smoke test
            # Run simulation, capture exit code and logs. Treat timeout (124) as acceptable
            # for a smoke test but record and upload logs if the simulation crashes early.
            - name: Run simulation smoke test
              shell: bash
              if: env.SKIP_JOB != 'true' && env.BUILD_FAILED == 'false'
              continue-on-error: true
              run: |
                  set -o pipefail
                  echo "Starting simulation for 30s (smoke test)..."
                  # Ensure gradlew is executable (harmless if already set)
                  chmod +x gradlew || true
                  # Capture stdout+stderr to a log file for later inspection
                  echo "--- Simulation run: $(date -u) ---" > simulate.log
                  
                  rc=0
                  timeout 30s ./gradlew simulateJava 2>&1 | tee -a simulate.log || rc=$?
                  
                  # Detect if "The robot program quit unexpectedly" exists in log
                  # (indicates a crash even if Gradle returned 0)
                  if grep -q "The robot program quit unexpectedly" simulate.log || grep -q "Unhandled exception" simulate.log; then
                      echo "CRASH_DETECTED=true" >> "$GITHUB_ENV"
                  else
                      echo "CRASH_DETECTED=false" >> "$GITHUB_ENV"
                  fi

                  echo $rc > sim_exit_code
                  if [ "$rc" -eq 0 ]; then
                      echo "Simulation completed successfully (rc=$rc)."
                      exit 0
                  elif [ "$rc" -eq 124 ]; then
                      echo "Simulation timed out after 30s (rc=$rc)."
                      exit 0
                  else
                      echo "Simulation crashed or failed early (rc=$rc). See simulate.log for details."
                  fi

            - name: Report simulation result and attach logs
              shell: bash
              if: env.SKIP_JOB != 'true' && env.BUILD_FAILED == 'false'
              run: |
                  rc=0
                  if [ -f sim_exit_code ]; then rc=$(cat sim_exit_code); fi
                  
                  crash_detected="${CRASH_DETECTED:-false}"
                  
                  # If simulation failed with a non-timeout non-zero exit code, OR we saw a crash in the logs
                  if ([ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]) || [ "$crash_detected" = "true" ]; then
                      echo "::warning::Build succeeded but robot simulation crashed or failed (rc=$rc, crash_detected=$crash_detected)."
                      
                      if [ "$crash_detected" = "true" ] && [ "$rc" -eq 124 ]; then
                          echo "## Simulation smoke test: FAILED (likely due to Notifier/Watchdog)" >> "$GITHUB_STEP_SUMMARY"
                      else
                          echo "## Simulation smoke test: FAILED" >> "$GITHUB_STEP_SUMMARY"
                      fi

                      if [ "$crash_detected" = "true" ]; then
                          echo "**Result**: Crash detected in logs." >> "$GITHUB_STEP_SUMMARY"
                      fi
                      echo "**Exit code**: $rc" >> "$GITHUB_STEP_SUMMARY"
                      echo "" >> "$GITHUB_STEP_SUMMARY"
                      echo '### Simulation log (tail - 200 lines):' >> "$GITHUB_STEP_SUMMARY"
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                      tail -n 200 simulate.log >> "$GITHUB_STEP_SUMMARY" || true
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "Simulation passed with code (rc=$rc)."
                      echo "## Simulation smoke test: Passed with code (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload simulation log
              if: env.SKIP_JOB != 'true' && env.BUILD_FAILED == 'false'
              uses: actions/upload-artifact@v4
              with:
                  name: simulation-log
                  path: simulate.log

            - name: Fail job if build or simulation failed
              if: always() && env.SKIP_JOB != 'true'
              shell: bash
              run: |
                  if [ "${BUILD_FAILED:-false}" = "true" ]; then
                      echo "::error::Gradle build failed. Failing job."
                      exit 1
                  fi

                  rc=0
                  if [ -f sim_exit_code ]; then rc=$(cat sim_exit_code); fi
                  crash_detected="${CRASH_DETECTED:-false}"
                  
                  if ([ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]) || [ "$crash_detected" = "true" ]; then
                      echo "::error::Simulation smoke test failed. Failing job after uploading logs."
                      exit 1
                  fi
                  echo "No failures detected."
